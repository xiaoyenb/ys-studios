name: unpack-deploy

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack
        run: |
          set -e
          ZIP=$(find . -maxdepth 1 -name '*.zip' -print -quit)
          if [ -z "$ZIP" ]; then
            echo "仓库根目录没有找到 zip"
            exit 1
          fi
          echo "找到压缩包: $ZIP"

          rm -rf _unpack
          mkdir -p _unpack
          unzip -q "$ZIP" -d _unpack

          if [ -d _unpack/ys-studio-deploy/ys-studio-deploy ]; then
            cp -r _unpack/ys-studio-deploy/ys-studio-deploy/. .
          elif [ -d _unpack/ys-studio-deploy ]; then
            cp -r _unpack/ys-studio-deploy/. .
          else
            cp -r _unpack/. .
          fi

          rm -rf _unpack "$ZIP"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "unpack deployment files" || exit 0
          git push
