# 前端站点（Nginx 静态托管）+ API 反向代理
# 适用：云服务器 / 宝塔 / 虚拟主机（需支持反向代理）

# 限流区（放在 http 上下文；本文件通常被 include 到 http 块中）
limit_req_zone $binary_remote_addr zone=ys_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=ys_login:10m rate=10r/m;

server {
    listen 80;
    server_name your-domain.com;
    server_tokens off;

    root /var/www/ys-studio/dist;
    index index.html;
    client_max_body_size 8m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # 基础安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # 禁止访问源码、数据库、日志、隐藏文件（防止误放目录）
    location ~* \.(env|db|sqlite|sqlite3|log|bak|ini|conf)$ { deny all; }
    location ~ /\. { deny all; }

    # 登录接口单独限流，降低爆破风险
    location = /api/admin/login {
        limit_req zone=ys_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后端 API 独立运行在 3001
    location /api/ {
        limit_req zone=ys_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Logo 等上传文件由 API 提供
    location /uploads/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=604800";
    }

    # 前台与独立后台入口
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后台入口：建议改成只有自己网络可访问（取消下面两行注释并换成你的固定 IP）
    location = /admin.html {
        # allow 203.0.113.10;
        # deny all;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }
}

# HTTPS 使用 certbot：
# certbot --nginx -d your-domain.com
# 启用 HTTPS 后再打开 HSTS（本节也可交给 certbot 自动添加）：
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
